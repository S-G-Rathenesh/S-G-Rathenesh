<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&amp;display=swap');

      .bg { fill: #0D1117; }
      .container { fill: rgba(13, 17, 23, 0.8); stroke: #3B82F6; stroke-width: 1.5; }
      .container-cyan { stroke: #00E5FF; }
      .container-purple { stroke: #8B5CF6; }
      
      .text-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .text-item { font-family: 'Share Tech Mono', monospace; font-size: 13px; fill: #FFFFFF; }
      
      .glow-cyan { filter: url(#glow-cyan); }
      .glow-purple { filter: url(#glow-purple); }

      .float { animation: floating 3s ease-in-out infinite alternate; }
      .float-d1 { animation-delay: -1s; }
      .float-d2 { animation-delay: -2s; }
      
      @keyframes floating {
        0% { transform: translateY(0); }
        100% { transform: translateY(-8px); }
      }
      
      .data-stream { stroke-dasharray: 10 5; animation: stream 5s linear infinite; }
      @keyframes stream { to { stroke-dashoffset: -100; } }
    </style>
    
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="350" class="bg" />

  <!-- Connection Lines between modules -->
  <path d="M 150 175 L 850 175 M 330 110 L 330 240 M 660 110 L 660 240" stroke="#3B82F6" stroke-width="1.5" class="data-stream" opacity="0.3" />

  <!-- MODULE 1: FRONTEND -->
  <g transform="translate(50, 40)" class="float">
    <rect x="0" y="0" width="260" height="110" class="container container-cyan" rx="10" />
    <path d="M 0 30 L 260 30" stroke="#00E5FF" stroke-width="1" />
    <text x="15" y="20" class="text-title glow-cyan" fill="#00E5FF">FRONTEND</text>
    
    <circle cx="20" cy="55" r="4" fill="#00E5FF" />
    <text x="35" y="60" class="text-item">React &amp; React Native</text>
    
    <circle cx="20" cy="85" r="4" fill="#00E5FF" />
    <text x="35" y="90" class="text-item">Flutter &amp; Web (HTML/CSS)</text>
  </g>

  <!-- MODULE 2: BACKEND -->
  <g transform="translate(50, 200)" class="float float-d1">
    <rect x="0" y="0" width="260" height="110" class="container container-purple" rx="10" />
    <path d="M 0 30 L 260 30" stroke="#8B5CF6" stroke-width="1" />
    <text x="15" y="20" class="text-title glow-purple" fill="#A855F7">BACKEND</text>
    
    <circle cx="20" cy="55" r="4" fill="#A855F7" />
    <text x="35" y="60" class="text-item">Python (FastAPI)</text>
    
    <circle cx="20" cy="85" r="4" fill="#A855F7" />
    <text x="35" y="90" class="text-item">Node.js &amp; Java / C++</text>
  </g>

  <!-- MODULE 3: AI CORE (Center Focus) -->
  <g transform="translate(370, 110)" class="float float-d2">
    <rect x="0" y="0" width="260" height="130" class="container" stroke="#3B82F6" rx="15" stroke-width="2" />
    <path d="M 0 35 L 260 35" stroke="#3B82F6" stroke-width="1" />
    <!-- Outer Glow Frame -->
    <rect x="-5" y="-5" width="270" height="140" fill="none" stroke="#00E5FF" stroke-width="1" rx="20" opacity="0.5" class="glow-cyan" />
    
    <text x="15" y="25" class="text-title" fill="#FFFFFF">AI &amp; ML CORE</text>
    <circle cx="230" cy="18" r="5" fill="#FFFFFF" class="glow-cyan pulse" />
    
    <text x="35" y="65" class="text-item">> TensorFlow Lite</text>
    <text x="35" y="90" class="text-item">> Groq AI / LLMs</text>
    <text x="35" y="115" class="text-item">> Predictive Modeling</text>
  </g>

  <!-- MODULE 4: DATABASE -->
  <g transform="translate(690, 40)" class="float float-d1">
    <rect x="0" y="0" width="260" height="110" class="container container-purple" rx="10" />
    <path d="M 0 30 L 260 30" stroke="#8B5CF6" stroke-width="1" />
    <text x="15" y="20" class="text-title glow-purple" fill="#A855F7">DATABASE</text>
    
    <circle cx="20" cy="55" r="4" fill="#A855F7" />
    <text x="35" y="60" class="text-item">MongoDB / NoSQL</text>
    
    <circle cx="20" cy="85" r="4" fill="#A855F7" />
    <text x="35" y="90" class="text-item">SQLite / MySQL</text>
  </g>

  <!-- MODULE 5: CLOUD & TOOLS -->
  <g transform="translate(690, 200)" class="float">
    <rect x="0" y="0" width="260" height="110" class="container container-cyan" rx="10" />
    <path d="M 0 30 L 260 30" stroke="#00E5FF" stroke-width="1" />
    <text x="15" y="20" class="text-title glow-cyan" fill="#00E5FF">CLOUD &amp; TOOLS</text>
    
    <circle cx="20" cy="55" r="4" fill="#00E5FF" />
    <text x="35" y="60" class="text-item">AWS, Firebase, Docker</text>
    
    <circle cx="20" cy="85" r="4" fill="#00E5FF" />
    <text x="35" y="90" class="text-item">Git, Figma, Unity</text>
  </g>

</svg>
