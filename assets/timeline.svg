<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&amp;display=swap');

      .bg { fill: #0D1117; }
      .line { stroke: #3B82F6; stroke-width: 4; }
      .line-glow { stroke: #00E5FF; stroke-width: 8; opacity: 0.5; filter: url(#glow); }
      
      .node-outer { fill: none; stroke: #A855F7; stroke-width: 2; }
      .node-inner { fill: #00E5FF; }
      
      .text-year { font-family: 'Share Tech Mono', monospace; font-size: 18px; fill: #00E5FF; font-weight: bold; }
      .text-desc { font-family: 'Share Tech Mono', monospace; font-size: 13px; fill: #FFFFFF; }
      .text-title { font-family: 'Orbitron', sans-serif; font-size: 14px; fill: #A855F7; }
      
      .anim-dash {
        stroke-dasharray: 10;
        animation: dashMove 15s linear infinite;
      }
      
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }

      .pulse { animation: pulsing 2s infinite alternate; }
      @keyframes pulsing {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 1; }
      }
    </style>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="200" class="bg" />

  <g transform="translate(50, 100)">
    <!-- Base Timeline Line -->
    <line x1="0" y1="0" x2="900" y2="0" class="line" />
    <line x1="0" y1="0" x2="900" y2="0" class="line-glow" />
    <line x1="0" y1="0" x2="900" y2="0" stroke="#FFFFFF" stroke-width="1" class="anim-dash" />
    
    <!-- Milestone 1 -->
    <g transform="translate(100, 0)">
      <circle cx="0" cy="0" r="14" class="node-outer" />
      <circle cx="0" cy="0" r="6" class="node-inner pulse glow" />
      <line x1="0" y1="-14" x2="0" y2="-40" stroke="#3B82F6" stroke-width="2" />
      <text x="0" y="-55" text-anchor="middle" class="text-year">INIT</text>
      <text x="0" y="-75" text-anchor="middle" class="text-title">FOUNDATION</text>
      <text x="0" y="30" text-anchor="middle" class="text-desc">Computer Science</text>
      <text x="0" y="45" text-anchor="middle" class="text-desc" fill="#3B82F6">Engineering Start</text>
    </g>

    <!-- Milestone 2 -->
    <g transform="translate(350, 0)">
      <circle cx="0" cy="0" r="14" class="node-outer" />
      <circle cx="0" cy="0" r="6" class="node-inner pulse glow" />
      <line x1="0" y1="14" x2="0" y2="40" stroke="#3B82F6" stroke-width="2" />
      <text x="0" y="65" text-anchor="middle" class="text-year">DEV</text>
      <text x="0" y="85" text-anchor="middle" class="text-title">FULL-STACK</text>
      <text x="0" y="-35" text-anchor="middle" class="text-desc">App Architecture</text>
      <text x="0" y="-20" text-anchor="middle" class="text-desc" fill="#3B82F6">React &amp; NodeJS</text>
    </g>

    <!-- Milestone 3 -->
    <g transform="translate(600, 0)">
      <circle cx="0" cy="0" r="18" class="node-outer" stroke="#00E5FF" stroke-width="3" />
      <circle cx="0" cy="0" r="8" class="node-inner pulse glow" fill="#A855F7" />
      <line x1="0" y1="-18" x2="0" y2="-40" stroke="#00E5FF" stroke-width="2" />
      <text x="0" y="-55" text-anchor="middle" class="text-year">AI_CORE</text>
      <text x="0" y="-75" text-anchor="middle" class="text-title glow">INTELLIGENCE</text>
      <text x="0" y="30" text-anchor="middle" class="text-desc">Machine Learning</text>
      <text x="0" y="45" text-anchor="middle" class="text-desc" fill="#3B82F6">TensorFlow Apps</text>
    </g>

    <!-- Milestone 4 -->
    <g transform="translate(850, 0)">
      <circle cx="0" cy="0" r="14" class="node-outer" />
      <circle cx="0" cy="0" r="6" class="node-inner pulse glow" />
      <line x1="0" y1="14" x2="0" y2="40" stroke="#3B82F6" stroke-width="2" />
      <text x="0" y="65" text-anchor="middle" class="text-year">SCALE</text>
      <text x="0" y="85" text-anchor="middle" class="text-title">FUTURE IMPACT</text>
      <text x="0" y="-35" text-anchor="middle" class="text-desc">Real-world AI</text>
      <text x="0" y="-20" text-anchor="middle" class="text-desc" fill="#3B82F6">Global Systems</text>
    </g>
    
  </g>
</svg>
