<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #0D1117; }
      .text-terminal { font-family: 'Share Tech Mono', monospace; font-size: 14px; fill: #8B5CF6; }
      .cursor { animation: blink 1s step-end infinite; }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .pulse {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
      }
    </style>
  </defs>

  <rect width="100%" height="100" class="bg" />
  
  <g transform="translate(400, 50)" text-anchor="middle">
    <!-- Top thin line -->
    <line x1="-300" y1="-30" x2="300" y2="-30" stroke="#3B82F6" stroke-width="1" opacity="0.3" />
    
    <text x="0" y="0" class="text-terminal">
      <tspan fill="#3B82F6">root@sg-rathenesh</tspan>
      <tspan fill="#FFFFFF">:~#</tspan>
      <tspan fill="#A855F7"> exit</tspan>
    </text>
    <text x="0" y="20" class="text-terminal" opacity="0.8">
      <tspan fill="#8B5CF6">SYSTEM STANDBY...</tspan>
      <tspan class="cursor" fill="#FFFFFF">_</tspan>
    </text>
    
    <!-- Status dots -->
    <circle cx="-300" cy="20" r="3" fill="#3B82F6" class="pulse" />
    <circle cx="300" cy="20" r="3" fill="#A855F7" class="pulse" style="animation-delay: 1s;" />
  </g>
</svg>
