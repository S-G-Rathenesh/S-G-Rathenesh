<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" height="150">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #0D1117; }
      .text-terminal { font-family: 'Share Tech Mono', monospace; font-size: 16px; fill: #00E5FF; }
      .text-red { fill: #FF0055; }
      .text-purple { fill: #A855F7; }
      
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      /* Typing sequences using staggered keyframes */
      .type-1, .type-2, .type-3, .type-4, .type-5 { opacity: 0; }
      
      .type-1 { animation: showText 0s 0.5s forwards; }
      .type-2 { animation: showText 0s 2s forwards; }
      .type-3 { animation: showText 0s 3.5s forwards; }
      .type-4 { animation: showText 0s 5s forwards; }
      .type-5 { animation: showText 0s 7s forwards; }
      
      @keyframes showText {
        to { opacity: 1; }
      }
      
      .glow { filter: url(#glow); }
    </style>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="150" class="bg" />
  
  <g transform="translate(30, 40)">
    <!-- Prompt -->
    <text x="0" y="0" class="text-terminal text-purple">root@sg-rathenesh:~$</text>
    <text x="190" y="0" class="text-terminal type-1"> ./shutdown.sh</text>
    
    <!-- Execution Output -->
    <text x="0" y="30" class="text-terminal type-2">> SYSTEM ONLINE <tspan class="text-purple">[OK]</tspan></text>
    <text x="0" y="55" class="text-terminal type-3">> Saving Session Data... <tspan class="text-purple">[DONE]</tspan></text>
    <text x="0" y="80" class="text-terminal type-4">> Disconnecting Neural Uplink... <tspan class="text-red">[CLOSED]</tspan></text>
    
    <text x="0" y="115" class="text-terminal type-5 text-purple glow">TERMINAL OFFLINE. GOODBYE.</text>
    <text x="240" y="115" class="text-terminal type-5 cursor text-purple glow">_</text>
  </g>
</svg>
