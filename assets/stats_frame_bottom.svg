<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" height="60">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .data-stream { stroke-dasharray: 20 10; animation: stream 5s linear infinite; }
      @keyframes stream { to { stroke-dashoffset: -100; } }
      .glow-cyan { filter: url(#glow-cyan); }
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur" /><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="60" class="bg" />
  
  <!-- Bracket Corners for Bottom -->
  <path d="M 15 0 L 15 45 L 985 45 L 985 0" fill="none" stroke="#00E5FF" stroke-width="2" class="glow-cyan" opacity="0.3" />
  
  <!-- Continuing Circuit Lines -->
  <path d="M 200 0 L 200 60" stroke="#3B82F6" stroke-width="2" class="data-stream" />
  <path d="M 500 0 L 500 60" stroke="#00E5FF" stroke-width="2" class="glow-cyan data-stream" />
  <path d="M 800 0 L 800 60" stroke="#8B5CF6" stroke-width="2" class="data-stream" />
</svg>
