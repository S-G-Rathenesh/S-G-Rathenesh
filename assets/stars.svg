<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <style>
      .star { fill: #FFFFFF; animation: twinkle infinite alternate; }
      .s1 { animation-duration: 2s; opacity: 0.8; }
      .s2 { animation-duration: 3s; opacity: 0.5; }
      .s3 { animation-duration: 1.5s; opacity: 0.3; }
      
      @keyframes twinkle {
        0% { transform: scale(1); opacity: 0.2; }
        100% { transform: scale(1.5); opacity: 1; }
      }
    </style>
  </defs>
  
  <rect width="100%" height="200" fill="#0D1117" />
  
  <g id="stars">
    <circle cx="10%" cy="20%" r="1.5" class="star s1" />
    <circle cx="25%" cy="80%" r="1" class="star s2" />
    <circle cx="45%" cy="30%" r="2" class="star s3" />
    <circle cx="65%" cy="70%" r="1.5" class="star s1" />
    <circle cx="85%" cy="15%" r="1" class="star s2" />
    <circle cx="95%" cy="60%" r="2" class="star s3" />
    
    <circle cx="15%" cy="60%" r="1" class="star s3" />
    <circle cx="35%" cy="10%" r="1.5" class="star s1" />
    <circle cx="55%" cy="90%" r="1" class="star s2" />
    <circle cx="75%" cy="40%" r="1.5" class="star s3" />
    <circle cx="90%" cy="85%" r="1" class="star s1" />
  </g>
</svg>
