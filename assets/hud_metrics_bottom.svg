<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 50" width="100%" height="50">
  <defs>
    <style>
      .bg{fill:#0D1117}
      .stream{stroke-dasharray:20 10;animation:s 5s linear infinite}@keyframes s{to{stroke-dashoffset:-100}}
      .pkt{stroke-dasharray:5 150;stroke-width:4;stroke-linecap:round;animation:pk 3s linear infinite}@keyframes pk{to{stroke-dashoffset:-310}}
    </style>
  </defs>
  <rect width="1000" height="50" class="bg"/>
  
  <rect x="25" y="0" width="950" height="20" fill="rgba(13,17,23,0.9)" stroke="#3B82F6" stroke-width="2" rx="0"/>
  <text x="500" y="14" font-family="'Share Tech Mono',monospace" font-size="11" fill="#3B82F6" text-anchor="middle">── END METRICS STREAM ──</text>
  
  <path d="M 25 0 L 25 20 L 40 20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <path d="M 975 0 L 975 20 L 960 20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  
  <path d="M 200 20 L 200 50" stroke="#3B82F6" stroke-width="2" class="stream"/>
  <path d="M 500 20 L 500 50" stroke="#00E5FF" stroke-width="2" class="stream"/>
  <path d="M 800 20 L 800 50" stroke="#8B5CF6" stroke-width="2" class="stream"/>
  <path d="M 500 20 L 500 50" fill="none" stroke="#00E5FF" class="pkt"/>
</svg>
