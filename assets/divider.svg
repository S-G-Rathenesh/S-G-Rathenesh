<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#neonGlow)">
    <line x1="0" y1="20" x2="800" y2="20" stroke="url(#neonGrad)" stroke-width="2" />
    <circle cx="400" cy="20" r="4" fill="#8B5CF6" />
    <circle cx="380" cy="20" r="2" fill="#3B82F6" />
    <circle cx="420" cy="20" r="2" fill="#A855F7" />
  </g>
</svg>
