<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #0D1117; }
      .grid { fill: url(#gridPattern); }
      .text-title { font-family: 'Orbitron', sans-serif; font-size: 48px; font-weight: 900; fill: #FFFFFF; }
      .text-subtitle { font-family: 'Share Tech Mono', monospace; font-size: 20px; fill: #3B82F6; }
      .text-glow { filter: url(#glow); }
      
      .typing-cursor {
        animation: blink 1s step-end infinite;
        fill: #8B5CF6;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .cyber-line {
        stroke: #A855F7;
        stroke-width: 2;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 3s ease-in-out forwards;
      }
      
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      
      .glitch-anim {
        animation: glitch 5s infinite;
      }
      
      @keyframes glitch {
        0%, 96%, 98%, 100% { opacity: 1; transform: translate(0, 0); }
        97% { opacity: 0.8; transform: translate(-2px, 2px); }
        99% { opacity: 0.8; transform: translate(2px, -2px); }
      }
    </style>
    
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1" />
    </pattern>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" class="bg" />
  <rect width="800" height="250" class="grid" />

  <!-- Animated Borders -->
  <path d="M 10 10 L 200 10 L 220 30 L 790 30" class="cyber-line" fill="none" />
  <path d="M 790 240 L 600 240 L 580 220 L 10 220" class="cyber-line" fill="none" stroke="#3B82F6" />

  <!-- Corner Accents -->
  <path d="M 10 10 L 10 40 M 10 10 L 40 10" stroke="#8B5CF6" stroke-width="3" fill="none" />
  <path d="M 790 240 L 790 210 M 790 240 L 760 240" stroke="#3B82F6" stroke-width="3" fill="none" />

  <!-- Content -->
  <g transform="translate(50, 100)">
    <!-- SYSTEM ID -->
    <text x="0" y="-30" font-family="'Share Tech Mono', monospace" font-size="14" fill="#A855F7" opacity="0.8">SYSTEM.ID // 0x4149</text>
    
    <!-- Title -->
    <text x="0" y="20" class="text-title text-glow glitch-anim" fill="url(#cyberGradient)">S-G-RATHENESH</text>
    
    <!-- Subtitle (Typing Effect Setup) -->
    <text x="0" y="60" class="text-subtitle">
      <tspan fill="#FFFFFF">&gt; INITIALIZING: </tspan>
      <tspan fill="#3B82F6">AI DEVELOPER_</tspan>
      <tspan class="typing-cursor">|</tspan>
    </text>
    
    <!-- Tech/Status Indicators -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="8" height="8" fill="#8B5CF6" class="typing-cursor" />
      <text x="15" y="8" font-family="'Share Tech Mono', monospace" font-size="12" fill="#8B5CF6">STATUS: ONLINE</text>
      
      <rect x="140" y="0" width="8" height="8" fill="#3B82F6" class="typing-cursor" style="animation-delay: 0.5s;" />
      <text x="155" y="8" font-family="'Share Tech Mono', monospace" font-size="12" fill="#3B82F6">MODULES: ACTIVE</text>
    </g>
  </g>

  <!-- Futuristic decorative elements -->
  <g transform="translate(650, 60)" opacity="0.7">
    <circle cx="50" cy="50" r="40" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="50" cy="50" r="30" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 20">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="20" fill="none" stroke="#A855F7" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="5" fill="#FFFFFF" class="text-glow" />
    <text x="105" y="55" font-family="'Share Tech Mono', monospace" font-size="10" fill="#3B82F6">CORE_</text>
  </g>

</svg>
